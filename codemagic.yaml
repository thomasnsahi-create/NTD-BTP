workflows:
  btp-manager-android-apk:
    name: Build APK Android
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      vars:
        SUPABASE_URL: "https://tdencfjfixgrycsjijqe.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_olirDTCYE7ah8GEceJpvGg_sgsojlwh"
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Génération automatique du pubspec.yaml s'il est absent
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            cat <<EOF > pubspec.yaml
          name: btp_manager_socle
          description: Application de gestion de projets et chantiers BTP avec Flutter et Supabase.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            supabase_flutter: ^2.5.0
            go_router: ^14.0.0
            flutter_dotenv: ^5.1.0
            intl: ^0.19.0
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
            assets:
              - .env
          EOF
          fi

      - name: Initialisation des dossiers natifs Flutter (android/ios)
        script: flutter create . --org com.btpmanager --project-name btp_manager_socle

      - name: Création du fichier .env pour Supabase
        script: |
          cat <<EOF > .env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Installation des dépendances
        script: flutter pub get

      - name: Compilation APK Release
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  btp-manager-android-apk:
    name: Build APK Android
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        SUPABASE_URL: "https://tdencfjfixgrycsjijqe.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_olirDTCYE7ah8GEceJpvGg_sgsojlwh"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
    scripts:
      - name: Localiser la racine du projet Flutter
        script: |
          # Cherche pubspec.yaml à la racine, sinon dans un sous-dossier (ex: btp_manager_socle/)
          if [ -f "$CM_BUILD_DIR/pubspec.yaml" ]; then
            PROJECT_DIR="$CM_BUILD_DIR"
          else
            PUBSPEC=$(find "$CM_BUILD_DIR" -maxdepth 3 -name pubspec.yaml -not -path "*/.dart_tool/*" | head -n 1)
            if [ -z "$PUBSPEC" ]; then
              echo "ERREUR : aucun pubspec.yaml trouvé dans le dépôt. Poussez le contenu du projet (lib/, pubspec.yaml, supabase/...)."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PUBSPEC")
          fi
          echo "Racine du projet : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $CM_ENV

      - name: Vérifier le code source
        script: |
          cd "$PROJECT_DIR"
          for f in lib/main.dart lib/app.dart; do
            [ -f "$f" ] || { echo "ERREUR : $f manquant"; exit 1; }
          done
          grep -q "flutter_riverpod" pubspec.yaml || { echo "ERREUR : pubspec.yaml n'est pas celui du projet (flutter_riverpod absent)"; exit 1; }
          if grep -rn "package:material_ui" lib; then
            echo "ERREUR : import invalide package:material_ui (utiliser package:flutter/material.dart)"; exit 1
          fi

      - name: Générer les dossiers natifs (android)
        script: |
          cd "$PROJECT_DIR"
          # Ne remplace ni lib/ ni pubspec.yaml existants ; nom du package = btp_manager (utilisé par les tests)
          flutter create . --org com.btpmanager --project-name btp_manager --platforms=android
          # Le test modèle généré référence MyApp (inexistant dans ce projet)
          rm -f test/widget_test.dart

      - name: Créer le fichier .env (Supabase)
        script: |
          cd "$PROJECT_DIR"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Installer les dépendances
        script: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Tests unitaires
        ignore_failure: true
        script: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Compilation APK Release
        script: |
          cd "$PROJECT_DIR"
          flutter build apk --release

    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
